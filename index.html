// Count of games scheduled per team per sport (includes bracket, filler, and PL).
function gameCountsPerSport() {
  const counts = {};
  for (const t of state.teams) {
    counts[t.id] = { VB: 0, HK: 0, SB: 0, total: 0 };
  }
  for (const sid of Object.keys(state.schedule)) {
    for (const g of state.schedule[sid]) {
      if (g.bye) continue;
      if (g.teamA && counts[g.teamA]) { counts[g.teamA][g.sport]++; counts[g.teamA].total++; }
      if (g.teamB && counts[g.teamB]) { counts[g.teamB][g.sport]++; counts[g.teamB].total++; }
    }
  }
  return counts;
}

// Convert a place map { teamId: 1..12 } to a points map { teamId: points }.
// Ties: N teams sharing place P each get pointsByPlace[P-1]; the next N-1 places
// are skipped (so 1, 2-tied, 4 — not 1, 2-tied, 3).
function pointsFromPlaces(placesMap) {
  const pts = {};
  for (const teamId of Object.keys(placesMap || {})) {
    const place = placesMap[teamId];
    if (!place || place < 1 || place > 12) continue;
    pts[teamId] = state.pointsByPlace[place - 1] || 0;
  }
  return pts;
}

function eventPlacesForSport(sport) {
  const t = state.tournaments[sport];
  if (!t) return {};
  return t.places || {};
}

// Parse a time string into seconds. Accepts "m:ss.s", "mm:ss", or plain
// seconds ("83.4"). Returns a number, or null for blank/invalid input.
function parseTime(str) {
  if (str == null) return null;
  const s = String(str).trim();
  if (!s) return null;
  if (s.includes(":")) {
    const parts = s.split(":");
    if (parts.length !== 2) return null;
    const min = Number(parts[0]);
    const sec = Number(parts[1]);
    if (!Number.isFinite(min) || !Number.isFinite(sec)) return null;
    return min * 60 + sec;
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

// Format seconds back to "m:ss.s" for display.
function formatTime(seconds) {
  if (seconds == null || !Number.isFinite(seconds)) return "";
  const min = Math.floor(seconds / 60);
  const sec = seconds - min * 60;
  return min + ":" + (sec < 10 ? "0" : "") + sec.toFixed(1);
}

// Rank entries [{teamId, value}] into a places map. Standard-competition
// ranking: equal values share a place, the next place is skipped (1,2,2,4).
// ascending=true → smallest value is 1st (times); false → largest is 1st.
function rankToPlaces(entries, ascending) {
  const sorted = entries.slice().sort((a, b) =>
    ascending ? a.value - b.value : b.value - a.value);
  const places = {};
  let place = 0, seen = 0, lastVal = null;
  for (const e of sorted) {
    seen++;
    if (lastVal === null || e.value !== lastVal) { place = seen; lastVal = e.value; }
    places[e.teamId] = place;
  }
  return places;
}

// Resolve any event to a { teamId: place } map, regardless of scoring type.
function placesForEvent(ev) {
  if (!ev) return {};
  if (ev.type === "time") {
    const entries = [];
    const times = ev.times || {};
    for (const teamId of Object.keys(times)) {
      const v = times[teamId];
      if (typeof v === "number" && Number.isFinite(v)) entries.push({ teamId, value: v });
    }
    return rankToPlaces(entries, true);
  }
  if (ev.type === "score") {
    const entries = [];
    const scores = ev.scores || {};
    for (const teamId of Object.keys(scores)) {
      const arr = scores[teamId];
      if (Array.isArray(arr) && arr.length === 3 && arr.every(n => typeof n === "number" && Number.isFinite(n))) {
        entries.push({ teamId, value: arr[0] + arr[1] + arr[2] });
      }
    }
    return rankToPlaces(entries, false);
  }
  if (ev.type === "rank") {
    const entries = [];
    const ranks = ev.ranks || {};
    for (const teamId of Object.keys(ranks)) {
      const arr = ranks[teamId];
      if (Array.isArray(arr) && arr.length === 3 && arr.every(n => typeof n === "number" && Number.isFinite(n))) {
        entries.push({ teamId, value: arr[0] + arr[1] + arr[2] });
      }
    }
    return rankToPlaces(entries, true);
  }
  // "places" (and untyped legacy events)
  return ev.places || {};
}

function listAllEvents() {
  const events = [];
  // The three slot-scheduled sports plus the standalone Rafting bracket.
  for (const sport of [...SPORTS, "RAFT"]) {
    const t = state.tournaments[sport];
    const places = eventPlacesForSport(sport);
    const complete = t && Object.keys(places).length === 12;
    events.push({
      id: `bracket-${sport}`,
      name: SPORT_NAMES[sport],
      kind: "bracket",
      sport,
      places,
      complete,
      removable: false,
    });
  }
  for (const ev of (state.customEvents || [])) {
    const places = placesForEvent(ev);
    events.push({
      id: ev.id,
      name: ev.name,
      kind: "custom",
      type: ev.type || "places",
      places,
      complete: Object.keys(places).length > 0,
      removable: true,
    });
  }
  return events;
}

function computeStandings() {
  const events = listAllEvents();
  const totals = {};
  const breakdown = {};
  for (const t of state.teams) {
    totals[t.id] = 0;
    breakdown[t.id] = {};
  }
  for (const ev of events) {
    const pts = pointsFromPlaces(ev.places);
    for (const t of state.teams) {
      const p = pts[t.id] || 0;
      breakdown[t.id][ev.id] = p;
      totals[t.id] += p;
    }
  }
  const ranked = state.teams.slice().sort((a, b) => totals[b.id] - totals[a.id]);
  return { events, totals, breakdown, ranked };
}

function renderStandingsView() {
  const root = document.getElementById("view-standings");
  if (!state.tournaments.VB) {
    root.innerHTML = `<div class="standings-section"><p>Generate brackets first to see standings.</p></div>`;
    return;
  }
  try {
    renderStandingsViewInner(root);
  } catch (e) {
    console.error("renderStandingsView failed", e);
    root.innerHTML = `<div class="standings-section">
      <h2>Standings unavailable</h2>
      <p class="hint">Something went wrong rendering this tab. Check the browser console for details.</p>
      <pre style="white-space: pre-wrap; font-size: 12px; color: var(--danger);">${escapeHtml(e && e.stack || String(e))}</pre>
    </div>`;
  }
}

function renderStandingsViewInner(root) {
  const { events, totals, breakdown, ranked } = computeStandings();
  const counts = gameCountsPerSport();

  // ----- Standings table -----
  let standingsRows = "";
  ranked.forEach((team, i) => {
    const cls = i < 3 ? `rank-${i + 1}` : "";
    const evCells = events.map(ev => {
      const p = breakdown[team.id][ev.id];
      return p > 0 ? `<td class="num">${p}</td>` : `<td class="dash">—</td>`;
    }).join("");
    standingsRows += `<tr class="${cls}">
      <td class="num">${i + 1}</td>
      <td class="team-name">${team.name}</td>
      <td class="num total">${totals[team.id]}</td>
      ${evCells}
    </tr>`;
  });
  const eventHeaders = events.map(ev => {
    const sportCls = ev.kind === "bracket" ? `sport-${SPORT_CLASS[ev.sport]}` : "";
    return `<th class="num ${sportCls}">${ev.name}</th>`;
  }).join("");

  // ----- Game-count grid -----
  let gameCountRows = "";
  for (const team of state.teams) {
    const c = counts[team.id];
    gameCountRows += `<tr>
      <td class="team-name">${team.name}</td>
      <td class="num">${c.VB}</td>
      <td class="num">${c.HK}</td>
      <td class="num">${c.SB}</td>
      <td class="num total">${c.total}</td>
    </tr>`;
  }

  // ----- Points-by-place inputs -----
  let pointsInputs = "";
  for (let i = 0; i < 12; i++) {
    pointsInputs += `<label><span>${i + 1}${ordinalSuffix(i + 1)}</span>
      <input type="number" inputmode="numeric" data-place="${i}" value="${state.pointsByPlace[i]}" />
    </label>`;
  }

  // ----- Events list -----
  const TYPE_LABEL = { places: "Placement", time: "Time-ranked", score: "Judged", rank: "Ranked" };
  const TYPE_VERB = { places: "placed", time: "timed", score: "scored", rank: "ranked" };
  let eventList = "";
  for (const ev of events) {
    const placeCount = Object.keys(ev.places).length;
    let status, statusCls, typeLabel;
    if (ev.kind === "bracket") {
      typeLabel = "Bracket";
      if (placeCount === 0) { status = "Not started"; statusCls = ""; }
      else if (placeCount === 12) { status = "Complete"; statusCls = "complete"; }
      else { status = `${placeCount} / 12 placed`; statusCls = ""; }
    } else {
      typeLabel = TYPE_LABEL[ev.type] || "Placement";
      const verb = TYPE_VERB[ev.type] || "placed";
      status = `${placeCount} / 12 ${verb}`;
      statusCls = placeCount === 12 ? "complete" : "";
    }
    eventList += `<div class="event-row">
      <span class="name">${escapeHtml(ev.name)}<span class="etype">${typeLabel}</span></span>
      <span class="status ${statusCls}">${status}</span>
      ${ev.removable ? `<button data-edit-event="${ev.id}">Edit</button>
                       <button class="danger" data-delete-event="${ev.id}">Delete</button>` : ""}
    </div>`;
  }

  root.innerHTML = `
    <div class="standings-section">
      <h2>Overall Standings</h2>
      <p class="hint">Updates live as places fill in. Top 3 highlighted.</p>
      <div class="table-scroll">
      <table class="standings-table">
        <thead>
          <tr>
            <th class="num">#</th>
            <th>Team</th>
            <th class="num">Total</th>
            ${eventHeaders}
          </tr>
        </thead>
        <tbody>${standingsRows}</tbody>
      </table>
      </div>
    </div>

    <div class="standings-section">
      <h2>Games per team</h2>
      <p class="hint">All scheduled games per sport (bracket, placement, and filler). Watch for any team getting too many fillers.</p>
      <div class="table-scroll">
      <table class="standings-table">
        <thead>
          <tr>
            <th>Team</th>
            <th class="num sport-vb">Volleyball</th>
            <th class="num sport-hk">Hockey</th>
            <th class="num sport-sb">Softball</th>
            <th class="num">Total</th>
          </tr>
        </thead>
        <tbody>${gameCountRows}</tbody>
      </table>
      </div>
    </div>

    <div class="standings-section">
      <h2>Points awarded per place</h2>
      <p class="hint">Edit to change how each finishing position scores. Defaults: 1st 20, 2nd 17, 3rd 14, 4th 11, 5th 8, 6th 5, 7th–12th 0.</p>
      <div class="points-grid">${pointsInputs}</div>
    </div>

    <div class="standings-section">
      <h2>Events</h2>
      <p class="hint">The four brackets (Volleyball, Hockey, Softball, Rafting) and every event below count toward standings. Tap Edit on an event to enter results.</p>
      ${eventList}
      <button class="add-event-btn" id="add-event-btn">+ Add custom event</button>
    </div>
  `;

  // Points-by-place editing
  root.querySelectorAll(".points-grid input[data-place]").forEach(inp => {
    inp.addEventListener("change", () => {
      const idx = Number(inp.dataset.place);
      const val = Number(inp.value);
      if (!Number.isFinite(val)) return;
      state.pointsByPlace[idx] = val;
      saveState();
      renderStandingsView();
    });
  });

  // Custom event buttons
  root.querySelectorAll("[data-edit-event]").forEach(btn => {
    btn.addEventListener("click", () => openCustomEventModal(btn.dataset.editEvent));
  });
  root.querySelectorAll("[data-delete-event]").forEach(btn => {
    btn.addEventListener("click", () => confirmDeleteCustomEvent(btn.dataset.deleteEvent));
  });
  document.getElementById("add-event-btn").addEventListener("click", () => openCustomEventModal(null));
}

function ordinalSuffix(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return s[(v - 20) % 10] || s[v] || s[0];
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const EVENT_TYPE_LABEL = { places: "Placement", time: "Time-ranked", score: "Judged", rank: "Ranked" };

function placesEditorHtml(ev) {
  const places = ev.places || {};
  const rows = state.teams.map(t => {
    const cur = places[t.id] || "";
    const opts = ['<option value="">—</option>']
      .concat(Array.from({ length: 12 }, (_, i) =>
        `<option value="${i + 1}" ${cur === i + 1 ? "selected" : ""}>${i + 1}${ordinalSuffix(i + 1)}</option>`
      )).join("");
    return `<label>
      <span class="tname">${escapeHtml(t.name)}</span>
      <select data-team="${t.id}">${opts}</select>
    </label>`;
  }).join("");
  return `<p class="ed-hint">Assign a place to each team. Leave blank if not participating. Ties are allowed — tied teams get the same points and the next place is skipped.</p>
    <div class="event-place-grid">${rows}</div>`;
}

function timeEditorHtml(ev) {
  const times = ev.times || {};
  const rows = state.teams.map(t => {
    const v = times[t.id];
    const val = (typeof v === "number" && Number.isFinite(v)) ? formatTime(v) : "";
    return `<label>
      <span class="tname">${escapeHtml(t.name)}</span>
      <input class="time-input" type="text" inputmode="decimal" data-team="${t.id}" placeholder="2:23.4" value="${val}" />
    </label>`;
  }).join("");
  return `<p class="ed-hint">Enter each team's time as <strong>m:ss.s</strong> (e.g. 1:23.4) or plain seconds. Fastest time places 1st. Leave blank if not participating.</p>
    <div class="event-place-grid">${rows}</div>`;
}

function scoreEditorHtml(ev) {
  const scores = ev.scores || {};
  const rows = state.teams.map(t => {
    const arr = Array.isArray(scores[t.id]) ? scores[t.id] : [];
    const j = i => (typeof arr[i] === "number" && Number.isFinite(arr[i])) ? arr[i] : "";
    const allNum = arr.length === 3 && arr.every(n => typeof n === "number" && Number.isFinite(n));
    const sum = allNum ? (arr[0] + arr[1] + arr[2]) : "—";
    return `<label class="score-row" data-team="${t.id}">
      <span class="tname">${escapeHtml(t.name)}</span>
      <span class="judges">
        <input type="number" inputmode="decimal" data-judge="0" value="${j(0)}" />
        <input type="number" inputmode="decimal" data-judge="1" value="${j(1)}" />
        <input type="number" inputmode="decimal" data-judge="2" value="${j(2)}" />
        <span class="sum">${sum}</span>
      </span>
    </label>`;
  }).join("");
  return `<p class="ed-hint">Enter all three judges' scores for each team. The three are summed; the highest total places 1st.</p>
    <div class="event-place-grid score-grid">${rows}</div>`;
}

function rankEditorHtml(ev) {
  const ranks = ev.ranks || {};
  const optsFor = (cur) => ['<option value="">—</option>']
    .concat(Array.from({ length: 12 }, (_, i) =>
      `<option value="${i + 1}" ${cur === i + 1 ? "selected" : ""}>${i + 1}</option>`
    )).join("");
  const rows = state.teams.map(t => {
    const arr = Array.isArray(ranks[t.id]) ? ranks[t.id] : [];
    const j = i => (typeof arr[i] === "number" && Number.isFinite(arr[i])) ? arr[i] : "";
    const allNum = arr.length === 3 && arr.every(n => typeof n === "number" && Number.isFinite(n));
    const sum = allNum ? (arr[0] + arr[1] + arr[2]) : "—";
    return `<label class="rank-row" data-team="${t.id}">
      <span class="tname">${escapeHtml(t.name)}</span>
      <span class="judges">
        <select data-judge="0">${optsFor(j(0))}</select>
        <select data-judge="1">${optsFor(j(1))}</select>
        <select data-judge="2">${optsFor(j(2))}</select>
        <span class="sum">${sum}</span>
      </span>
    </label>`;
  }).join("");
  return `<p class="ed-hint">Enter all three 1–12 rankings for each team. The three are summed; the <strong>lowest</strong> total places 1st. Leave blank if not participating.</p>
    <div class="event-place-grid score-grid">${rows}</div>`;
}

function editorHtmlFor(type, ev) {
  if (type === "time") return timeEditorHtml(ev);
  if (type === "score") return scoreEditorHtml(ev);
  if (type === "rank") return rankEditorHtml(ev);
  return placesEditorHtml(ev);
}

function attachScoreSumListeners() {
  document.querySelectorAll(".score-row[data-team]").forEach(row => {
    const inputs = row.querySelectorAll("input[data-judge]");
    const sumEl = row.querySelector(".sum");
    const update = () => {
      let sum = 0, allNum = true;
      inputs.forEach(inp => {
        const s = inp.value.trim();
        if (s === "") { allNum = false; return; }
        const n = Number(s);
        if (Number.isFinite(n)) sum += n; else allNum = false;
      });
      sumEl.textContent = allNum ? String(sum) : "—";
    };
    inputs.forEach(inp => inp.addEventListener("input", update));
  });
}

function attachRankSumListeners() {
  document.querySelectorAll(".rank-row[data-team]").forEach(row => {
    const inputs = row.querySelectorAll("select[data-judge]");
    const sumEl = row.querySelector(".sum");
    const update = () => {
      let sum = 0, allNum = true;
      inputs.forEach(inp => {
        const s = inp.value.trim();
        if (s === "") { allNum = false; return; }
        const n = Number(s);
        if (Number.isFinite(n)) sum += n; else allNum = false;
      });
      sumEl.textContent = allNum ? String(sum) : "—";
    };
    inputs.forEach(inp => inp.addEventListener("change", update));
  });
}

// Auto-insert the colon: once a single minute digit is typed, append ":" so
// the user types m, then ss.s (e.g. 2 → "2:" → 2:23.4). 1-digit minutes.
function attachTimeMask() {
  document.querySelectorAll(".time-input[data-team]").forEach(inp => {
    inp.addEventListener("input", (e) => {
      let v = inp.value.replace(/[^\d:.]/g, "");
      if (e.inputType === "insertText" && /^\d$/.test(v)) v = v + ":";
      if (v !== inp.value) inp.value = v;
    });
  });
}

function mountEditor(type, ev) {
  document.getElementById("event-editor").innerHTML = editorHtmlFor(type, ev);
  if (type === "score") attachScoreSumListeners();
  if (type === "rank") attachRankSumListeners();
  if (type === "time") attachTimeMask();
}

// Reads the open editor's DOM into a data object for the given type.
function readEditor(type) {
  if (type === "time") {
    const times = {};
    document.querySelectorAll(".time-input[data-team]").forEach(inp => {
      const sec = parseTime(inp.value);
      if (sec != null && Number.isFinite(sec)) times[inp.dataset.team] = sec;
    });
    return { times };
  }
  if (type === "score") {
    const scores = {};
    document.querySelectorAll(".score-row[data-team]").forEach(row => {
      const vals = [null, null, null];
      let any = false;
      row.querySelectorAll("input[data-judge]").forEach(inp => {
        const idx = Number(inp.dataset.judge);
        const s = inp.value.trim();
        if (s !== "") {
          const n = Number(s);
          if (Number.isFinite(n)) { vals[idx] = n; any = true; }
        }
      });
      if (any) scores[row.dataset.team] = vals;
    });
    return { scores };
  }
  if (type === "rank") {
    const ranks = {};
    document.querySelectorAll(".rank-row[data-team]").forEach(row => {
      const vals = [null, null, null];
      let any = false;
      row.querySelectorAll("select[data-judge]").forEach(sel => {
        const idx = Number(sel.dataset.judge);
        const s = sel.value.trim();
        if (s !== "") {
          const n = Number(s);
          if (Number.isFinite(n)) { vals[idx] = n; any = true; }
        }
      });
      if (any) ranks[row.dataset.team] = vals;
    });
    return { ranks };
  }
  const places = {};
  document.querySelectorAll(".event-place-grid select[data-team]").forEach(sel => {
    const v = Number(sel.value);
    if (v >= 1 && v <= 12) places[sel.dataset.team] = v;
  });
  return { places };
}

function openCustomEventModal(eventId) {
  const existing = eventId ? (state.customEvents || []).find(e => e.id === eventId) : null;
  const isNew = !existing;
  const curType = existing ? (existing.type || "places") : "places";
  const initialName = existing ? existing.name : "";

  const typeControl = isNew
    ? `<select class="event-type-select" id="event-type">
         <option value="places">Placement — enter 1st–12th by hand</option>
         <option value="time">Time-ranked — fastest time wins</option>
         <option value="score">Judged — three judges' scores summed, highest wins</option>
         <option value="rank">Ranked — three 1–12 rankings summed, lowest wins</option>
       </select>`
    : `<div class="event-type-fixed">${EVENT_TYPE_LABEL[curType]} event</div>`;

  openModal(`
    <h2>${existing ? "Edit event" : "Add custom event"}</h2>
    <div class="body">
      <input class="event-name-input" id="event-name" placeholder="Event name (e.g., Relay Race)" value="${escapeHtml(initialName)}" />
      ${typeControl}
      <div id="event-editor"></div>
    </div>
    <div class="actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="save-event">${existing ? "Save" : "Add"}</button>
    </div>
  `);

  mountEditor(curType, existing || { type: curType, places: {}, times: {}, scores: {}, ranks: {} });

  if (isNew) {
    document.getElementById("event-type").addEventListener("change", (e) => {
      mountEditor(e.target.value, { type: e.target.value, places: {}, times: {}, scores: {}, ranks: {} });
    });
  }

  document.getElementById("save-event").addEventListener("click", () => {
    const name = document.getElementById("event-name").value.trim();
    if (!name) { showToast("Event needs a name"); return; }
    const type = isNew ? document.getElementById("event-type").value : curType;
    const data = readEditor(type);
    if (existing) {
      existing.name = name;
      existing.type = type;
      if (type === "places") existing.places = data.places;
      else if (type === "time") existing.times = data.times;
      else if (type === "score") existing.scores = data.scores;
      else if (type === "rank") existing.ranks = data.ranks;
    } else {
      const ev = {
        id: `ev-${Date.now().toString(36)}-${Math.floor(Math.random() * 1e4)}`,
        name, type,
      };
      if (type === "places") ev.places = data.places;
      else if (type === "time") ev.times = data.times;
      else if (type === "score") ev.scores = data.scores;
      else if (type === "rank") ev.ranks = data.ranks;
      state.customEvents.push(ev);
    }
    saveState();
    closeModal();
    renderStandingsView();
  });
}

function confirmDeleteCustomEvent(eventId) {
  const ev = (state.customEvents || []).find(e => e.id === eventId);
  if (!ev) return;
  openModal(`
    <h2>Delete "${escapeHtml(ev.name)}"?</h2>
    <div class="body">This removes the event and its points from standings.</div>
    <div class="actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="danger" id="confirm-delete-ev">Delete</button>
    </div>
  `);
  document.getElementById("confirm-delete-ev").addEventListener("click", () => {
    state.customEvents = state.customEvents.filter(e => e.id !== eventId);
    saveState();
    closeModal();
    renderStandingsView();
  });
}

// ----- Settings view -----

function renderSettingsView() {
  const hasBrackets = !!state.tournaments.VB;
  document.getElementById("view-settings").innerHTML = `
    <div class="settings-section">
      <h2>Re-seed brackets</h2>
      <p>Randomly re-seed all three tournaments. <strong>Wipes all results and schedule.</strong></p>
      <button class="danger" id="reseed-btn">Re-seed all brackets</button>
    </div>
    <div class="settings-section">
      <h2>Export / Import</h2>
      <p>Back up the current state as JSON, or restore from a previous backup.</p>
      <button id="export-btn">Export JSON</button>
      <button id="import-btn">Import JSON</button>
    </div>
    <div class="settings-section">
      <h2>Full reset</h2>
      <p>Wipes everything — teams, brackets, schedule, results.</p>
      <button class="danger" id="reset-btn">Full reset</button>
    </div>
    <div class="settings-section">
      <h2>About</h2>
      <p>RMCC 2026 Sports Scheduler · 12 teams · 3 double-elimination tournaments · 34 thirty-min slots Sun–Fri.</p>
      <p>Each sport runs independent random seeding. Grand Finals are held for Friday slots.</p>
    </div>
  `;

  document.getElementById("reseed-btn").addEventListener("click", () => {
    openModal(`
      <h2>Re-seed all brackets?</h2>
      <div class="body">This wipes every recorded result and the entire schedule.</div>
      <div class="actions">
        <button onclick="closeModal()">Cancel</button>
        <button class="danger" id="confirm-reseed">Re-seed</button>
      </div>
    `);
    document.getElementById("confirm-reseed").addEventListener("click", () => {
      state.schedule = {};
      state.fillerUsage = {};
      generateAllBrackets();
      ensureSlotScheduled(0);
      currentSlotId = 0;
      saveState();
      closeModal();
      render();
      switchView("slot");
    });
  });

  document.getElementById("export-btn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    a.download = `rmcc-sports-${ts}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("import-btn").addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/json";
    inp.addEventListener("change", () => {
      const file = inp.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const imported = JSON.parse(r.result);
          if (imported.version !== 1) throw new Error("Unknown version");
          state = imported;
          ensureStateFields(state);
          currentSlotId = 0;
          saveState();
          render();
          showToast("Imported");
        } catch (e) {
          showToast("Import failed: " + e.message);
        }
      };
      r.readAsText(file);
    });
    inp.click();
  });

  document.getElementById("reset-btn").addEventListener("click", () => {
    openModal(`
      <h2>Full reset?</h2>
      <div class="body">This deletes everything. You'll be back to the welcome screen.</div>
      <div class="actions">
        <button onclick="closeModal()">Cancel</button>
        <button class="danger" id="confirm-reset">Reset everything</button>
      </div>
    `);
    document.getElementById("confirm-reset").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state = newState();
      currentSlotId = 0;
      saveState();
      closeModal();
      render();
      switchView("slot");
    });
  });
}

// Expose for inline onclick
window.closeModal = closeModal;

// ============================================================
// Boot
// ============================================================

const loaded = loadState();
if (loaded) {
  state = loaded;
} else {
  state = newState();
  saveState();
}
ensureStateFields(state);
render();
</script>
